name: Build Singularity kebab (KernelSU-Next)

# 用途：
#   用 The-Anomalist/Singularity 内核源码 + 指定版本的 KernelSU-Next，
#   交叉编译出 OnePlus 8T (kebab) 的 Image，并重新打包成刷机用的 AnyKernel3 zip。
#
# 两种模式：
#   ksu_mode = fork     保持作者 fork 里的 pinned commit（复刻官方 V17，用来验证流水线）
#   ksu_mode = upstream 把 KernelSU-Next 切到上游指定 tag（真正的版本升级，如 v3.4.2）
#
# 推荐用法：
#   第 1 次：ksu_mode=fork                        → 验证工具链/编译/打包是否通
#   第 2 次：ksu_mode=upstream + ksu_ref=v3.4.2   → 真正升级内核侧 KSU
#
# 默认 upstream 产物：4.19.325-cip135-st19-ksu342-Singularity + KernelSU-Next v3.4.2 + SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核仓库 owner/repo"
        default: "The-Anomalist/Singularity"
        required: true
      kernel_ref:
        description: "内核分支 / tag / commit"
        default: "event-horizon"
        required: true
      mode:
        description: "full = 完整编译并打包；ksu-only = 只编 drivers/kernelsu（约 6 分钟，用于快速验证 4.19 补丁）"
        type: choice
        options:
          - full
          - ksu-only
        default: full
      ksu_mode:
        description: "KernelSU-Next 来源：fork = 作者 pinned commit；upstream = 上游 tag"
        type: choice
        options:
          - upstream
          - fork
        default: upstream
      ksu_repo:
        description: "KernelSU-Next 上游仓库 owner/repo（仅 upstream 模式使用）"
        default: "KernelSU-Next/KernelSU-Next"
        required: true
      ksu_ref:
        description: "编进内核的 KernelSU-Next tag（仅 upstream 模式使用）"
        default: "v3.4.2"
        required: true
      defconfig:
        description: "defconfig 目标名"
        default: "vendor/kona-perf_defconfig"
        required: true
      clang_r:
        description: "AOSP clang 预编译版本"
        default: "clang-r596125"
        required: true
      clang_url:
        description: "（可选）直接指定 clang 压缩包 URL；留空则自动在 main-kernel / android17-release 之间回退"
        default: ""
        required: false
      localversion_st:
        description: "写入 localversion-st 的后缀（便于区分自编译版本；留空则不改）"
        default: "-st19-ksu342"
        required: false
      build_noksu:
        description: "是否额外编一个 No-KSU 版本（时间约 +10 分钟）"
        type: boolean
        default: true
      ak3_release:
        description: "AnyKernel3 骨架来源 release tag"
        default: "V17"
        required: true
      ak3_asset:
        description: "AnyKernel3 骨架 zip 文件名"
        default: "Singularity-V1.5.0-unified-Root-or-NoKSU.zip"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build kebab kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      OUT_DIR: out

    steps:
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            zip unzip rsync cpio kmod device-tree-compiler python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # 下面两个在部分镜像上可能不存在，缺了也不该让整个 job 挂掉
          sudo apt-get install -y --no-install-recommends libncurses5 || true
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi || true
          echo "--- toolchain ---"
          aarch64-linux-gnu-gcc --version | head -1

      - name: 检出本仓库（提供 patches/ 与 scripts/）
        uses: actions/checkout@v4

      - name: 拉取内核源码
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.kernel_ref }}" \
            "https://github.com/${{ inputs.kernel_repo }}.git" kernel
          cd kernel
          git submodule update --init --recursive --depth 1
          git log -1 --oneline
          echo "--- drivers/kernelsu 指向 ---"
          ls -l drivers/kernelsu

      - name: 准备 KernelSU-Next（模式：${{ inputs.ksu_mode }}）
        run: |
          set -euo pipefail
          cd kernel/KernelSU-Next
          BASE="$(git rev-parse HEAD)"
          echo "作者 fork 的 pinned commit: $BASE"
          git log -1 --oneline "$BASE"

          if [ "${{ inputs.ksu_mode }}" = "upstream" ]; then
            git remote add upstream "https://github.com/${{ inputs.ksu_repo }}.git" 2>/dev/null || true
            git fetch --depth 1 upstream \
              "refs/tags/${{ inputs.ksu_ref }}:refs/tags/${{ inputs.ksu_ref }}" \
              || git fetch --depth 1 upstream "${{ inputs.ksu_ref }}"
            git checkout -f "${{ inputs.ksu_ref }}"
            echo "== 已切到上游 ${{ inputs.ksu_ref }} =="
            echo "== 以下作者 fork 补丁被丢弃（若编译/开机出问题，优先看这些是否需要重新移植）=="
            git log --oneline "HEAD..$BASE" || true
          else
            echo "== 保持作者 pinned commit，用于复刻官方 V17 =="
          fi

          # 通用健全性检查：KSU 源码在 kernel/ 子目录里，仓库根目录没有这些文件
          # （v3.4.2 的 kernel/ 有 susfs/，v3.3.0 没有，所以不能用目录名判断）
          for f in kernel/Kconfig kernel/Kbuild kernel/Makefile; do
            if [ ! -f "$f" ]; then
              echo "!! 缺少 $f，submodule 不完整"
              exit 1
            fi
          done
          echo "--- KernelSU kernel/ 内容 ---"
          ls -1 kernel | head -25

          KSU_EFFECTIVE="$(git describe --tags --always)"
          echo "KernelSU-Next 实际版本: $KSU_EFFECTIVE"
          echo "KSU_EFFECTIVE=$KSU_EFFECTIVE" >> "$GITHUB_ENV"

      - name: 应用 linux-4.19 兼容补丁（仅 upstream 模式）
        if: ${{ inputs.ksu_mode == 'upstream' }}
        run: |
          set -euo pipefail
          cd kernel/KernelSU-Next
          shopt -s nullglob
          patches=(../../patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "没有 patches/*.patch，跳过"
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "==> 应用 $p"
            git apply -p1 --verbose "$p"
          done
          echo "--- 校验关键守卫 ---"
          grep -n 'KERNEL_VERSION(4, 20, 0)' kernel/infra/file_wrapper.c || true

      - name: 打上版本标记
        if: ${{ inputs.localversion_st != '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ inputs.localversion_st }}" > kernel/localversion-st
          echo "localversion-cip = $(cat kernel/localversion-cip)"
          echo "localversion-st  = $(cat kernel/localversion-st)"

      - name: 下载 clang ${{ inputs.clang_r }}
        env:
          CLANG_R: ${{ inputs.clang_r }}
          CLANG_URL_OVERRIDE: ${{ inputs.clang_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang"

          # 关键：必须校验 gzip magic（1f 8b）。
          # googlesource 对不存在的 ref 会返回 400/404 + HTML 错误页，
          # 若 curl 不加 -f，会把 HTML 存进 .tar.gz 且退出码仍是 0，
          # 随后 tar 才报 "not in gzip format"。
          try_fetch() {
            local url="$1" code
            echo "==> 尝试: $url"
            code=$(curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
                        --connect-timeout 30 --max-time 900 \
                        -o "$RUNNER_TEMP/clang.tar.gz" -w '%{http_code}' "$url" 2>/dev/null || true)
            if [ -s "$RUNNER_TEMP/clang.tar.gz" ] && \
               [ "$(head -c 2 "$RUNNER_TEMP/clang.tar.gz" | od -An -tx1 | tr -d ' \n')" = "1f8b" ]; then
              echo "    下载成功 (http=${code})，大小 $(du -h "$RUNNER_TEMP/clang.tar.gz" | cut -f1)"
              return 0
            fi
            echo "    失败 (http=${code:-无})，响应开头是："
            head -c 160 "$RUNNER_TEMP/clang.tar.gz" 2>/dev/null || true
            echo
            rm -f "$RUNNER_TEMP/clang.tar.gz"
            return 1
          }

          ok=0
          if [ -n "${CLANG_URL_OVERRIDE:-}" ]; then
            try_fetch "$CLANG_URL_OVERRIDE" && ok=1
          else
            for ref in refs/heads/main-kernel refs/heads/android17-release; do
              if try_fetch "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${ref}/${CLANG_R}.tar.gz"; then
                ok=1
                break
              fi
            done
          fi
          [ "$ok" = 1 ] || { echo "!! 所有 clang 源都失败；可在 workflow 里用 clang_url 参数指定镜像"; exit 1; }

          tar -xf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/clang"
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang/bin/clang" --version

      - name: 配置内核
        run: |
          set -euo pipefail
          cd kernel
          MAKE_ARGS=(
            ARCH=arm64
            O="$OUT_DIR"
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )
          make "${MAKE_ARGS[@]}" "${{ inputs.defconfig }}"

          # ---- 针对 clang 22 的两处适配 ----
          # 1) FRAME_WARN：4.19 默认 2048，drivers/interconnect/qcom/kona.c 里
          #    kona_icc_refresh_bcm_shadow 的栈帧 2784，配合 CONFIG_CC_WERROR=y
          #    直接变成 -Werror 失败。抬到上限 8192。
          # 2) 关掉 CC_WERROR：源码是按更老的 clang 写的，用 clang 22 编会冒出
          #    更多“新警告变错误”，先把这条路堵死，避免每次都要重跑 40 分钟。
          ./scripts/config --file "$OUT_DIR/.config" \
            --set-val FRAME_WARN 8192 \
            -d CC_WERROR
          # 3) 关掉 DEBUG_INFO：vmlinux 调试信息对 Image 无用，却让 vDSO 阶段
          #    刷出几十万行 objdump "Unrecognized form" 警告、还显著拖慢编译。
          ./scripts/config --file "$OUT_DIR/.config" \
            -d DEBUG_INFO -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_REDUCED
          make "${MAKE_ARGS[@]}" olddefconfig >/dev/null

          echo "--- 关键配置 ---"
          grep -E '^CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_SUSFS|FRAME_WARN|CC_WERROR|DEBUG_INFO)' "$OUT_DIR/.config" || true

      - name: 快速检查：只编 drivers/kernelsu（mode=ksu-only）
        if: ${{ inputs.mode == 'ksu-only' }}
        run: |
          set -euo pipefail
          cd kernel
          MAKE_ARGS=(
            ARCH=arm64
            O="$OUT_DIR"
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )
          echo "==> make prepare"
          make "${MAKE_ARGS[@]}" -j"$(nproc)" prepare 2>&1 | sed -u '/Unrecognized form/d' | tail -5
          # KSU 的 file_wrapper.c 会 include security/selinux/include/objsec.h，
          # 它依赖构建期生成的 flask.h。只编 KSU 目录时必须先编 SELinux，
          # 否则会误报 'flask.h' file not found（完整构建里不会有这问题）。
          echo "==> 预编译 security/selinux（生成 flask.h）"
          make "${MAKE_ARGS[@]}" -j"$(nproc)" security/selinux/ 2>&1 | sed -u '/Unrecognized form/d' | tail -5
          echo "==> 只编译 drivers/kernelsu"
          make "${MAKE_ARGS[@]}" -j"$(nproc)" drivers/kernelsu/ 2>&1 | sed -u '/Unrecognized form/d'
          echo "==> KSU 目录编译通过"

      - name: 编译完整 Image（mode=full）
        if: ${{ inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          cd kernel
          MAKE_ARGS=(
            ARCH=arm64
            O="$OUT_DIR"
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )
          # 过滤 objdump 对 DWARF 的噪音（保留其它所有输出）；
          # 因为有 pipefail，make 的失败码仍会正确向上传递。
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image 2>&1 | sed -u '/Unrecognized form/d'
          echo "--- 内核版本 ---"
          make "${MAKE_ARGS[@]}" kernelrelease
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$RUNNER_TEMP/artifacts/Image-KSU"
          ls -l "$RUNNER_TEMP/artifacts/Image-KSU"

      - name: 编译 No-KSU 版
        if: ${{ inputs.mode == 'full' && inputs.build_noksu }}
        run: |
          set -euo pipefail
          cd kernel
          MAKE_ARGS=(
            ARCH=arm64
            O="$OUT_DIR"
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )
          ./scripts/config --file "$OUT_DIR/.config" -d KSU -d KSU_MANUAL_HOOK
          make "${MAKE_ARGS[@]}" olddefconfig >/dev/null
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image 2>&1 | sed -u '/Unrecognized form/d'
          cp "$OUT_DIR/arch/arm64/boot/Image" "$RUNNER_TEMP/artifacts/Image-NoKSU"
          ls -l "$RUNNER_TEMP/artifacts/Image-NoKSU"

      - name: 重新打包 AnyKernel3
        if: ${{ inputs.mode == 'full' }}
        env:
          AK3_RELEASE: ${{ inputs.ak3_release }}
          AK3_ASSET: ${{ inputs.ak3_asset }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
          LOCALVERSION_ST: ${{ inputs.localversion_st }}
        run: |
          set -euo pipefail
          export KSU_REF="${KSU_EFFECTIVE:-${{ inputs.ksu_ref }}}"
          bash scripts/pack_anykernel.sh

      - name: 上传产物
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: singularity-kebab-run${{ github.run_number }}
          path: |
            ${{ runner.temp }}/artifacts/*.zip
            ${{ runner.temp }}/artifacts/*.txt
          if-no-files-found: error

      - name: 摘要
        if: ${{ inputs.mode == 'full' }}
        run: |
          {
            echo "### Singularity kebab 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 内核源码 | ${{ inputs.kernel_repo }} @ ${{ inputs.kernel_ref }} |"
            echo "| KSU 模式 | ${{ inputs.ksu_mode }} |"
            echo "| KernelSU-Next 实际版本 | ${KSU_EFFECTIVE:-unknown} |"
            echo "| defconfig | ${{ inputs.defconfig }} |"
            echo "| 版本后缀 | ${{ inputs.localversion_st }} |"
            echo "| clang | ${{ inputs.clang_r }} |"
          } >> "$GITHUB_STEP_SUMMARY"
